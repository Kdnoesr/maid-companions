# maid-companions bundle patch: inserts its host entry into the web plugin
# roster. The `dsh.client` declaration in package.json makes the web app load
# the ./client bundle as the browser half. (Added 2026-09-13: the 0.1.5 core's
# profile loader requires every listed bundle to declare dsh.bundle.)
- insert:
    - id: maid-companions
      name: '@kdnoesr/maid-companions'
